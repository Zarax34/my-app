name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --org com.example --project-name ollama_mobile_studio --platforms android .
          git checkout -- pubspec.yaml lib/

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Hive, Riverpod)
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            echo "Generating code..."
            dart run build_runner build --delete-conflicting-outputs || echo "Codegen done"
          fi

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
