name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ hashFiles('pubspec.lock') }}'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Hive adapters, etc.)
        run: |
          if [ -f "pubspec.lock" ] && grep -q "build_runner" pubspec.lock; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "No build_runner dependencies found, skipping code generation"
          fi

      - name: Analyze code
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
