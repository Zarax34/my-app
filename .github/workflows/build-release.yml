name: Build & Release (APK + AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  FLUTTER_VERSION: '3.16.0'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: 'flutter-${{ env.FLUTTER_VERSION }}'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔨 Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 🔍 Analyze code
        run: flutter analyze

      - name: 🧪 Run tests (if any)
        run: flutter test || true

      - name: 🏗️ Build Debug APK
        run: flutter build apk --debug

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🏗️ Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 📊 Create Release Summary
        if: always()
        run: |
          echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Debug APK | ✅ Success | $(ls -lh build/app/outputs/flutter-apk/app-debug.apk | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          echo "| Release APK | ✅ Success | $(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
          echo "| App Bundle | ✅ Success | $(ls -lh build/app/outputs/bundle/release/app-release.aab | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY

      - name: 🚀 Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
